# ThinkPad P14s Gen 6 AMD: the i8042 controller (built-in keyboard + TrackPoint)
# wedges silently in use with no kernel errors; only a suspend/resume cycle
# revives it. i8042.nomux=1 disables active PS/2 multiplexing, the reported
# workaround for this controller generation (see Debian bug #1115112).
#
# This drop-in is sourced by grub-mkconfig after /etc/default/grub, so it must
# restate the full value. If keyboard deaths recur, add i8042.reset=1 here and
# run `sudo update-grub`.
GRUB_CMDLINE_LINUX_DEFAULT="quiet i8042.nomux=1"
