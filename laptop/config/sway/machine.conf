# ThinkPad AMD: 1920x1200 internal panel with comfortable fractional scaling.
set $primary_output eDP-1
set $secondary_output eDP-1
set $notification_command dunst
set $gammastep_command ~/.dotfiles/sway/launch-gammastep.sh
set $screenshot_command ~/.dotfiles/sway/screenshot.sh
set $screenshot_path_command ~/.dotfiles/sway/screenshot-path.sh
set $ocr_screenshot_command ~/.dotfiles/sway/ocr-screenshot.sh
set $type_clipboard_command ~/.dotfiles/sway/type-from-clipboard.sh

output eDP-1 mode 1920x1200 scale 1.25 position 0,0 adaptive_sync off
seat * xcursor_theme Adwaita 36

bindsym $mod+d exec --no-startup-id wofi --show drun

input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
}
