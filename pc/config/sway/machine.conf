# Desktop NVIDIA: MSI 1080p primary and Samsung 4K secondary.
set $primary_output DP-1
set $secondary_output HDMI-A-1
set $notification_command $HOME/Scripts/dunst-launch.sh
set $gammastep_command $HOME/Scripts/launch-gammastep
set $screenshot_command $HOME/Scripts/screenshot
set $screenshot_path_command $HOME/Scripts/screenshot-path
set $ocr_screenshot_command $HOME/Scripts/ocr-screenshot
set $type_clipboard_command $HOME/Scripts/type-from-clipboard

output DP-1 mode 1920x1080@165Hz position 0,0 adaptive_sync off
output HDMI-A-1 mode 3840x2160@60Hz position 1920,0 adaptive_sync off max_render_time 10
seat * xcursor_theme Adwaita 24

exec --no-startup-id dbus-update-activation-environment --systemd GBM_BACKEND __GLX_VENDOR_LIBRARY_NAME

# Preserve the desktop's physical-key Rofi binding and monitor selection.
bindcode $mod+40 exec "rofi -modi drun,run -show drun -no-sort -monitor 'DP-1'"

# Speech-to-text currently depends on the desktop's NVIDIA Python libraries.
bindsym $mod+v exec --no-startup-id ~/Scripts/stt-toggle.sh
